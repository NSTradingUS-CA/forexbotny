name: 💹 Forex Sniper 7-12

on:
  workflow_dispatch:
  repository_dispatch:        # déclenché par Cron-job.org à 07:00 ET
  schedule:
    # 2e déclenchement automatique à 12:30 ET (16:30 UTC)
    # Prend le relais avant que GitHub ne tue le 1er run à 13:00 ET (limite 6h)
    - cron: '30 16 * * 1-5'   # 12:30 ET, du lundi au vendredi

concurrency:
  group: forex-sniper
  cancel-in-progress: false   # le 2e run ATTEND la fin du 1er, ne l'annule pas

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install v20 pandas python-dotenv requests pytz pyyaml

      - name: Run Forex Bot
        run: python bot_v7.py
