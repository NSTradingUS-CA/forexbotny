name: 💹 Forex Sniper 7-12

on:
  workflow_dispatch:
  repository_dispatch:        # déclenché par Cron-job.org à 06:30 ET
  schedule:
    # ⚠️ GitHub cron est TOUJOURS en UTC et ne connaît PAS l'heure d'été/hiver.
    # Un seul cron est actif, à ajuster manuellement 2x/an :
    #   - Été (mars → novembre) : '30 16 * * 1-5' = 12:30 EDT
    #   - Hiver (novembre → mars) : '30 17 * * 1-5' = 12:30 EST
    # Le 2e déclenchement inutile (13:30 EDT en été, 11:30 EST en hiver) est éliminé.
    - cron: '30 16 * * 1-5'

concurrency:
  group: forex-sniper
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install v20 pandas python-dotenv requests pytz pyyaml

      - name: Run Forex Bot
        run: python bot_v7.py
