name: 💹 Forex Sniper 7-12

on:
  workflow_dispatch:
  repository_dispatch:        # déclenché par Cron-job.org à 06:30 ET
  schedule:
    # ⚠️ GitHub cron est TOUJOURS en UTC. On déclare 2 crons pour couvrir
    # les 2 saisons et on laisse le filtre Python dans bot_v7.py rejeter
    # celui qui ne tombe pas dans la fenêtre 12:25-13:30 ET.
    #   - Été (EDT, UTC-4) : '30 16' = 12:30 ET ✅
    #   - Hiver (EST, UTC-5) : '30 17' = 12:30 ET ✅
    # → Aucun ajustement manuel 2x/an.
    - cron: '30 16 * * 1-5'
    - cron: '30 17 * * 1-5'

concurrency:
  group: forex-sniper
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      PYTHONUNBUFFERED: "1"
      # Permet au script de distinguer un déclenchement cron d'un dispatch.
      # Vide pour repository_dispatch / workflow_dispatch, contient l'expression
      # cron (ex. '30 16 * * 1-5') pour les déclenchements schedule.
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --timeout 60 --retries 5 \
            "v20==3.0.25.0" \
            "pandas==2.2.3" \
            "numpy==1.26.4" \
            "python-dotenv==1.0.1" \
            "requests==2.32.3" \
            "pytz==2024.2" \
            "pyyaml==6.0.2"

      - name: Run Forex Bot
        run: python bot_v7.py
