name: 💹 Forex Sniper 7-12

on:
  workflow_dispatch:
  repository_dispatch:
    # ⚠️ IMPORTANT : ce workflow est plafonné à 6h par GitHub.
    # Configurez Cron-job.org pour dispatcher DEUX fois par jour :
    #   - 1er dispatch : 07:00 ET  (démarre la session)
    #   - 2e  dispatch : 12:30 ET  (reprend la session avant coupure)
    # Le bot reprend automatiquement via status.json + load_existing_open_position().

# Empêche deux runs simultanés (le 2e attendrait sinon le 1er éternellement)
concurrency:
  group: forex-sniper
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # 6h = plafond GitHub, inutile de mettre plus
    permissions:
      contents: write

    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install v20 pandas python-dotenv requests pytz pyyaml

      - name: Run Forex Bot
        run: python bot_v7.py
