name: 💹 Forex Sniper 7-12

on:
  workflow_dispatch:          # permet le test manuel
  repository_dispatch:        # déclenché par Cron-job.org

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 660
    permissions:
      contents: write         # ✅ permet de pusher status.json dans le dépôt

    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}   # ✅ token pour l'écriture du fichier
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # ✅ utilise le token pour le checkout (optionnel mais sécurisé)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install v20 pandas python-dotenv requests pytz pyyaml

      - name: Run Forex Bot
        run: python bot_v7.py
