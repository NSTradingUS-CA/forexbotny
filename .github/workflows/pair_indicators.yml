name: 📊 Pair Indicators Updater

on:
  workflow_dispatch:
  repository_dispatch:

concurrency:
  group: pair-indicators
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install v20 pandas python-dotenv requests pytz PyYAML

      - name: Run Pair Indicators
        run: python pair_indicators.py
