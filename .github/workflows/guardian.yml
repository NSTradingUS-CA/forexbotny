name: 🛡️ Trade Guardian

on:
  schedule:
    # ⚠️ GitHub cron est TOUJOURS interprété en UTC. Il n'accepte PAS de
    # spécifier un fuseau horaire. On calcule donc l'UTC équivalent à la
    # fenêtre locale voulue, et on l'ajuste 2x/an pour l'heure d'été/hiver.
    #
    # Fenêtre utile réelle : 16:40 → 17:15 ET
    #   → après la mort du bot principal (kill GitHub à 13:00 ET)
    #   → avant/après la clôture OANDA à 16:59 ET
    #
    # 3 crons uniquement (un par alerte Guardian) pour éviter les doublons.
    # Les fenêtres Python tolèrent un retard GitHub cron d'environ ±7 min.
    #
    # Été (EDT, UTC-4) :
    #   20:45 UTC = 16:45 ET → rappel pré-clôture
    #   20:55 UTC = 16:55 ET → dernier appel
    #   21:10 UTC = 17:10 ET → post-mortem
    #
    # Hiver (EST, UTC-5) : à ajuster en novembre :
    #   21:45 UTC = 16:45 ET → rappel pré-clôture
    #   21:55 UTC = 16:55 ET → dernier appel
    #   22:10 UTC = 17:10 ET → post-mortem
    - cron: '45 20 * * 1-5'    # 16:45 EDT (été)
    - cron: '55 20 * * 1-5'    # 16:55 EDT (été)
    - cron: '10 21 * * 1-5'    # 17:10 EDT (été)
  workflow_dispatch:

concurrency:
  group: trade-guardian
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run guardian
        run: python guardian.py
