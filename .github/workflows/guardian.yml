name: 🛡️ Trade Guardian

on:
  schedule:
    # ⚠️ GitHub cron est TOUJOURS interprété en UTC. Il n'accepte PAS de
    # spécifier un fuseau horaire. On calcule donc l'UTC équivalent à la
    # fenêtre locale voulue, et on l'ajuste 2x/an pour l'heure d'été/hiver.
    #
    # Fenêtre utile réelle : 16:40 → 17:15 ET
    #   → après la mort du bot principal (kill GitHub à 13:00 ET)
    #   → avant/après la clôture OANDA à 16:59 ET
    #
    # Été (EDT, UTC-4) : 20:40 → 21:15 UTC
    #   '40,45,50,55 20 * * 1-5'  →  16:40, 16:45, 16:50, 16:55 EDT
    #   '0,5,10,15 21 * * 1-5'    →  17:00, 17:05, 17:10, 17:15 EDT
    #
    # Hiver (EST, UTC-5) : à ajuster en novembre :
    #   '40,45,50,55 21 * * 1-5'  →  16:40, 16:45, 16:50, 16:55 EST
    #   '0,5,10,15 22 * * 1-5'    →  17:00, 17:05, 17:10, 17:15 EST
    - cron: '40,45,50,55 20 * * 1-5'
    - cron: '0,5,10,15 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: trade-guardian
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run guardian
        run: python guardian.py
