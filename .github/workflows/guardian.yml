name: 🛡️ Trade Guardian

on:
  schedule:
    # ⚠️ GitHub cron est en UTC. On déclare 6 crons :
    #   3 pour l'heure d'été (EDT, UTC-4) + 3 pour l'heure d'hiver (EST, UTC-5).
    #   Python filtre selon l'heure locale 'America/Toronto'.
    #   Aucun ajustement manuel 2×/an.
    #
    # Fenêtre ET utile : 16:44 → 17:14 (alignée sur les reminders du bot)
    #
    # Été (EDT) :
    - cron: '50 20 * * 1-5'   # 16:50 EDT → pré-clôture
    - cron: '56 20 * * 1-5'   # 16:56 EDT → dernier appel
    - cron: '06 21 * * 1-5'   # 17:06 EDT → post-mortem
    # Hiver (EST) :
    - cron: '50 21 * * 1-5'   # 16:50 EST → pré-clôture
    - cron: '56 21 * * 1-5'   # 16:56 EST → dernier appel
    - cron: '06 22 * * 1-5'   # 17:06 EST → post-mortem
  workflow_dispatch:

concurrency:
  group: trade-guardian
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Run guardian
        run: python guardian.py
