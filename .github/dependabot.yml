# .github/dependabot.yml
version: 2
updates:
  # Mises à jour des dépendances Python (pip)
  - package-ecosystem: "pip"
    directory: "/"                     # Racine du dépôt
    schedule:
      interval: "weekly"               # Vérification chaque lundi
      day: "monday"
    target-branch: "main"              # Branche cible pour les PR
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5        # Nombre max de PR ouvertes en simultané
    labels:
      - "dependencies"
      - "python"
    # Optionnel : ignorer certaines dépendances si besoin
    # ignore:
    #   - dependency-name: "v20"
    #     versions: [">= 1.0.0"]

  # (Optionnel) Mises à jour des actions GitHub utilisées dans les workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
